name: Refresh data

# Re-scrapes DAAD every Monday and republishes the dashboard if anything changed.
# Can also be started by hand from the Actions tab.
on:
  schedule:
    - cron: "0 4 * * 1"  # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Scrape DAAD and rebuild the dashboard
        run: python -m germany_masters all
      - name: Check the new data
        run: pytest -q
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh DAAD data ($(date -u +%Y-%m-%d))"
            git push
          fi
